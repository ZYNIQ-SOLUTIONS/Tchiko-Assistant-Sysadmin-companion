name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    name: Ubuntu GTK3 Tests & Self-Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ubuntu GTK3 & Cairo system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0 \
            xclip \
            xvfb

      - name: Verify Python syntax compilation
        run: python3 -m compileall -q main.py tchiko tests

      - name: Run unit & integration test suite
        run: xvfb-run -a python3 -m unittest discover -s tests -v

      - name: Run end-to-end subsystem self-test
        run: xvfb-run -a python3 main.py --self-test

      - name: Install optional dev linters (ruff, mypy)
        run: |
          python3 -m pip install --user --break-system-packages ruff mypy || true

      - name: Run ruff lint (non-blocking if not installed)
        run: |
          if command -v ruff >/dev/null 2>&1 || python3 -m ruff --version >/dev/null 2>&1; then
            python3 -m ruff check main.py tchiko tests
          fi
